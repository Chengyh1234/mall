server:
  port: 8080

spring:
  application:
    name: mall-gateway
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        group: DEFAULT_GROUP
    gateway:
      # 路由规则（当前阶段所有服务仍在 mall-all，后续拆分后更新 uri 为 lb://xxx）
      routes:
        # 认证授权服务
        - id: auth-service
          # uri: http://localhost:8081
          uri: lb://mall-auth #使用lb需要导入依赖
          predicates:
            - Path=/api/auth/**,/api/captcha/**

        # 用户服务（用户信息 + 收货地址）
        - id: user-service
          uri: lb://mall-user
          predicates:
            - Path=/api/user/**,/api/address/**

        # 商品服务（mall-product）
        - id: product-service
          uri: lb://mall-product
          predicates:
            - Path=/api/sku/**,/api/spu/**,/api/brand/**,/api/category/**,/api/attribute/**

        # 订单服务（含购物车）
        - id: order-service
          uri: http://localhost:8888
          predicates:
            - Path=/api/order/**,/api/cart/**

        # 店铺服务（含横幅广告、文件上传）
        - id: store-service
          uri: lb://mall-store
          predicates:
            - Path=/api/store/**,/api/banner/**,/api/file/**,/api/store-admin/**,/api/admin/store/**,/api/store/apply/**
        # 管理后台
        - id: admin-service
          uri: http://localhost:8888
          predicates:
            - Path=/api/admin/**,/api/uploads/**

      # 全局跨域配置
      globalcors:
        # 1. 必须保留，解决OPTIONS预检请求
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            # 2. 核心：去掉 "*"，换上你前端的真实域名（注意用 patterns）
            allowed-origin-patterns:
              - "http://localhost.*"   # 你的正式前端域名
            # 3. 方法限制：只开放你需要的方法（不要无脑全开）
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS  # OPTIONS 必须保留，预检要用
            # 4. 请求头：如果需要自定义 Token 头，建议明确列出
            allowed-headers: "*"
            # 5. 携带凭证（如果你的登录态依赖 Cookie 或 Header Token，必须开）
            allow-credentials: true
            # 6. 缓存时间可以设长一点，减少预检请求
            maxAge: 3600

# 健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always