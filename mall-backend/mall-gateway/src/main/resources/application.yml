server:
  port: 8080

spring:
  application:
    name: mall-gateway
  cloud:
    gateway:
      # 路由规则（当前阶段所有服务仍在 mall-all，后续拆分后更新 uri 为 lb://xxx）
      routes:
        # 认证授权服务（含管理员仪表盘）
        - id: auth-service
          # uri: http://localhost:8081
          uri: lb://mall-auth #使用lb需要导入依赖
          predicates:
            - Path=/api/auth/**,/api/captcha/**,/api/admin/**

        # 用户服务（用户信息 + 收货地址）
        - id: user-service
          uri: lb://mall-user
          predicates:
            - Path=/api/user/**,/api/address/**

        # 商品服务（mall-product）
        - id: product-service
          uri: lb://mall-product
          predicates:
            - Path=/api/sku/**,/api/spu/**,/api/brand/**,/api/category/**,/api/attribute/**

        # 订单服务（含购物车、物流、发货）
        - id: order-service
          uri: lb://mall-order
          predicates:
            - Path=/api/order/**,/api/cart/**,/api/delivery/**,/api/logistics/**

        # 店铺服务（含横幅广告、文件上传）
        - id: store-service
          uri: lb://mall-store
          predicates:
            - Path=/api/store/**,/api/banner/**,/api/file/**,/api/store-admin/**,/api/admin/store/**,/api/store/apply/**
        

      # HTTP 客户端配置（路由转发超时控制）
      httpclient:
        # 连接超时：建立 TCP 连接的最大等待时间（毫秒）
        connect-timeout: 5000
        # 响应超时：等待下游服务返回响应的最大时间
        response-timeout: 10s

      # 全局跨域配置
      # 已迁移至 CorsConfig.java（CorsWebFilter），在 WebFlux 层面统一处理 CORS 预检请求
      # globalcors 配置在 WebFlux 中效果不佳，已移除

# 文件上传基础路径
# 实际目录：mall-backend/uploads/，相对于工作目录 mall/ 的路径为 mall-backend/uploads
file:
  upload:
    base-path: ./uploads

# 健康检查端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 日志配置