# 1. 数据源（数据库地址、账号、密码）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_platform?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # 2. Redis 配置（IP和端口）
  data:
    redis:
      host: 192.168.31.140   # 开发环境可能是本地或测试机
      port: 6379

  # 3. RabbitMQ 配置（IP、端口、账号、密码）
  rabbitmq:
    host: 192.168.31.140
    port: 5672
    username: admin
    password: admin

# 4. Elasticsearch 配置（IP和端口）
elasticsearch:
  host: 192.168.31.140
  port: 9200
  index: mall_spu

# 5. 文件上传路径（开发环境建议用本地路径，生产环境可能是挂载盘路径）
file:
  upload:
    base-path: ./uploads