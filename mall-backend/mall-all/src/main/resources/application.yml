management:
  health:
    elasticsearch:
      enabled: false
    mail:
      enabled: false

mall:
  order:
    pay-expire-minutes: 30
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto #配置主键自增
      #逻辑删除配置
      logic-delete-value: 1 # 逻辑删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  configuration:
    #在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射
    map-underscore-to-camel-case: true
