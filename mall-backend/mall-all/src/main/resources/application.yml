server:
  port: 8888
  servlet:
    context-path: /api

spring:
  application:
    name: reggie_take_out
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  cache:
    redis:
      time-to-live: 180000

  # ==================== RabbitMQ 配置 ====================
  rabbitmq:
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual          # 手动 ACK，防止消息丢失
        prefetch: 5                       # 每次预取 5 条 能者多劳
        retry:
          enabled: true                   # 开启重试
          max-attempts: 3                 # 最大重试次数
          initial-interval: 1000          # 首次重试间隔 1s
          multiplier: 2                   # 间隔倍数（1s → 2s → 4s）
        default-requeue-rejected: false   # 重试耗尽后不重新入队，进入 DLQ

  #当用户请求的URL在Spring MVC中找不到任何匹配的控制器（Controller）来处理时，
  #让系统抛出 NoHandlerFoundException 异常，而不是像默认那样直接返回一个404错误页面
  mvc:
    throw-exception-if-no-handler-found: true #这个需要配合下面进行使用
  #Spring Boot默认会为 /** 路径映射一个静态资源处理器（ResourceHttpRequestHandler）。
  #这意味着任何请求路径都会被这个处理器“接住”，从而不会触发 NoHandlerFoundException。
  web:
    resources:
      add-mappings: false

  # ==================== 邮件配置 ====================
  mail:
    default-encoding:
    host: smtp.qq.com
    port: 587
    username: 2265534937@qq.com
    password: xwypdgkcdnmdeade
