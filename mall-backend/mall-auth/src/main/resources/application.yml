server:
  port: 8081
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  application:
    name: mall-auth
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  cache:
    redis:
      time-to-live: 180000
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.31.140:8848
        namespace: 6e152ee2-97b5-461d-aa45-32f1fb13a5ca
        group: DEFAULT_GROUP
    # ==================== Sentinel 熔断降级 ====================
    sentinel:
      transport:
        dashboard: localhost:8718
      eager: true
  # ==================== 邮件配置 ====================
  mail:
    default-encoding:
    host: smtp.qq.com
    port: 587
    username: 2265534937@qq.com
    password: xwypdgkcdnmdeade
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# ==================== Feign 熔断降级（使用 Sentinel） ====================
feign:
  circuitbreaker:
    enabled: true

# Feign 日志级别（全局默认）
logging:
  level:
    com.cyh.mallauth.feign: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info