server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: mall-auth
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  # ==================== 邮件配置 ====================
  mail:
    default-encoding:
    host: smtp.qq.com
    port: 587
    username: 2265534937@qq.com
    password: xwypdgkcdnmdeade
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# ==================== Feign 熔断降级（使用 Sentinel） ====================
feign:
  circuitbreaker:
    enabled: true

# Feign 日志级别（全局默认）
logging:
  level:
    com.cyh.mallauth.feign: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info