server:
  port: 8083
#  address: 127.0.0.1
  servlet:
    context-path: /api

spring:
  #容器中本就不需要 UserDetailsService。排除这个自动配置后，
  #Spring Security 就不会自作主张创建默认用户了，
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: mall-store
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# 文件上传配置（已迁移至 mall-common 的 FileServiceImpl）
#file:
#  upload:
#    base-path: ./uploads

# ==================== Feign 熔断降级（使用 Sentinel） ====================
feign:
  circuitbreaker:
    enabled: true

# Feign 日志级别
logging:
  level:
    com.cyh.mallstore.feign: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"
