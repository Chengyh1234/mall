spring:
  application:
    name: mall-order
  #Nacos 有一个默认行为： 会自动加载一个 Data ID 为 {spring.application.name}.{file-extension} 的配置
  #服务专用配置 (mall-order.yml) > 共享配置 (mall-shared-config.yml)
  cloud:
    nacos:
      config:
        server-addr: 192.168.31.140:8848
        namespace: 6e152ee2-97b5-461d-aa45-32f1fb13a5ca
        group: DEFAULT_GROUP
        file-extension: yml
        shared-configs:
          - data-id: mall-shared-config.yml
            group: DEFAULT_GROUP
            refresh: true