server:
  port: 8085
  servlet:
    context-path: /api

spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: mall-order
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# 订单配置
mall:
  order:
    pay-expire-minutes: 30

# ==================== Feign 熔断降级（使用 Sentinel） ====================
feign:
  circuitbreaker:
    enabled: true

# Feign 日志级别
logging:
  level:
    com.cyh.mallorder.feign: INFO